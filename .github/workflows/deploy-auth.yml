name: Deploy Auth Microservice to MonsterASP

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Auth.Services.API/**'
      - 'Welco.Shared/**'
      - '.github/workflows/deploy-auth.yml'
      - '.github/workflows/webdeploy.ps1'
      - '.github/workflows/ftp-deploy.py'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Auth Service
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Deploy via Publish Profile
        shell: pwsh
        env:
          PROFILE_XML: ${{ secrets.AUTH_PUBLISH_PROFILE }}
          PROFILE_PASSWORD: ${{ secrets.AUTH_FTP_PASSWORD }}
        run: |
          .\.github\workflows\webdeploy.ps1 `
            -ProjectPath "Auth.Services.API/Auth.Services.API.csproj" `
            -PublishDir "./publish/auth" `
            -PublishProfileContent $env:PROFILE_XML
