name: Deploy API Gateway to MonsterASP

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Welco.API/**'
      - 'Welco.Shared/**'
      - '.github/workflows/deploy-gateway.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Gateway Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Publish API Gateway
        run: |
          dotnet publish "Welco.API/Welco.Gateway.API.csproj" \
            -c Release \
            -o ./publish/gateway

      - name: Deploy to MonsterASP via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.GATEWAY_FTP_SERVER }}
          username: ${{ secrets.GATEWAY_FTP_USERNAME }}
          password: ${{ secrets.GATEWAY_FTP_PASSWORD }}
          local-dir: ./publish/gateway/
          server-dir: /
          security: loose
          dangerous-clean-slate: false
