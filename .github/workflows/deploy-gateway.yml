name: Deploy API Gateway to MonsterASP

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Welco.API/**'
      - 'Welco.Shared/**'
      - '.github/workflows/deploy-gateway.yml'
      - '.github/workflows/webdeploy.ps1'
      - '.github/workflows/ftp-deploy.py'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Gateway Service
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Deploy via Publish Profile
        shell: pwsh
        env:
          PROFILE_XML: ${{ secrets.GATEWAY_PUBLISH_PROFILE }}
          PROFILE_PASSWORD: ${{ secrets.GATEWAY_FTP_PASSWORD }}
        run: |
          .\.github\workflows\webdeploy.ps1 `
            -ProjectPath "Welco.API/Welco.Gateway.API.csproj" `
            -PublishDir "./publish/gateway" `
            -PublishProfileContent $env:PROFILE_XML
