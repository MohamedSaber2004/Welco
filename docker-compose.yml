services:
  gateway:
    build:
      context: .
      dockerfile: Welco.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Test
      - ASPNETCORE_HTTP_PORTS=8080
    depends_on:
      - auth-service

  auth-service:
    build:
      context: .
      dockerfile: Auth.Services.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Test
      - ASPNETCORE_HTTP_PORTS=8080
