services:
  # 1. API Gateway (Public Web Service)
  - type: web
    name: welco-gateway
    env: docker
    dockerfilePath: Welco.API/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Test
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080

  # 2. Auth Service (Private Service)
  - type: pserv
    name: auth-service
    env: docker
    dockerfilePath: Auth.Services.API/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Test
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080
      # Sensitive: Injected at runtime in Render Dashboard, not stored in Git
      - key: ConnectionStrings__DatabaseConnection
        sync: false
